# Let the Zrythm session (cage and Zrythm, started by tinydm as the default user)
# use real-time scheduling and lock its memory (unlimited, so future mappings are
# locked too). The limits PipeWire installs for its group (/etc/security/limits.d/25-pw-rlimits.conf)
# need pam_limits, which tinydm's PAM stack lacks.
[Service]
LimitRTPRIO=95
LimitNICE=-19
LimitMEMLOCK=infinity
